[build-system]
# setuptools>=77 是 `license-files` 与 SPDX 字符串 license 的下限（PEP 639）；
# 低于它时 `license = "MIT"` 会被拒。>=62 则是 `data/**/*` 通配的起点。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-cost-calculator"
version = "0.2.0"
description = "菜谱/食堂采购成本核算器：进货单导入 → 净料换算 → 菜品成本卡 → 毛利率定价 → 价格波动预警（确定性规则引擎，纯本地）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["recipe", "cost", "catering", "cost-card", "yield-rate", "deterministic"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
# GUI 交付形态（重件，仅界面层需要）
gui = ["PySide6>=6.6,<7"]
# 测试期依赖：测试套件真 import 的每个库都必须在这里（测试面 = 安装面）
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]
# 构建期依赖（不进运行时必需面）
# PyInstaller >=6 是硬下限：打 PySide6 GUI 时 5.x 确定性崩在
# "Instruction object is not iterable"。setuptools 上限见 README 已知环境问题。
build = [
    "PyInstaller>=6.0",
    "setuptools<81",
]

[project.scripts]
rcc = "rcc.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/10-15-recipe-cost-calculator"

[tool.setuptools]
# ``benchmark/`` 是仓库顶层的第二个包（不在 src/ 下）：基准套件由 ``rcc bench``
# 通过 ``from benchmark import runner`` 导入，因此它**必须真的被装上**——只声明
# ``where = ["src"]`` 时，源码态在仓库根跑 ``python -m rcc.cli bench`` 能过
# （CWD 在 sys.path 上），冻结态也能过（PyInstaller 显式收了它），**只有装好的
# 控制台脚本 ``rcc bench`` 会 ModuleNotFoundError**（M6 干净环境验证抓出）。
# 故显式给出 benchmark 的 package-dir 映射，并同时纳入 find。
package-dir = { "" = "src", "benchmark" = "benchmark" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rcc*", "benchmark*"]

# 随包数据（M7）。**没有这一段，wheel 里一个数据文件都没有**：数据原先在仓库根
# `data/`（包外），而 `rcc.packaging.find_data_dir()` 源码态靠 `repo_root()` 命中
# 仓库根才拿得到——`pip install` 之后 `repo_root()` 找到的是 `<venv>`，
# `selftest`/`bench`/`run` 全部 FileNotFoundError。把数据搬进 `src/rcc/data/`
# 并在此登记，装态与源码态就走同一条"包旁边找 data/"的路。
# 注意 `**` 需要 setuptools>=62 的通配支持；本文件 build-system 下限已满足。
[tool.setuptools.package-data]
rcc = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: 需要 PySide6 的界面测试（缺依赖时模块级跳过）",
    "install: 装真 wheel 的装态门（建 venv + 装包，约 30s；不许 skip）",
]
