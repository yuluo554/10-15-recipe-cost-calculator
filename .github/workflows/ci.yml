name: CI

# M0 即配 CI（不推迟到发布期）：避免"把全项目 CI 首跑风险压进发布窗口"的反模式。
# 编码三层加固之一：CI 全局 UTF-8（只救 CI，代码入口守卫与子进程显式 encoding 另两层）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

on:
  push:
  pull_request:

# 只读仓库内容：本仓 CI 不写任何 GitHub 状态（无 issue/PR 评论、无 artifact 上传）
permissions:
  contents: read

# 同一分支的新推送取消旧的进行中 run——排队中的旧 run 对新提交没有意义，
# 只会拖长"看到结果"的时延。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 解释器 floor 已抬到 3.12（3.8 于 2024-10 EOL、3.9 于 2025-10、
        # 3.10 于 2026-10 EOL）。矩阵保留 windows + ubuntu 两条，守住
        # "跨平台确定性"这个真信号；旧通道不再声明。
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 历史扫描类守门依赖 git 历史——浅克隆会让它静默削弱成空验
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test extras
        # extras 集合必须覆盖全部里程碑门的依赖（pytest / pyyaml）
        run: python -m pip install -e ".[dev]"

      - name: Generate frozen artifacts and verify bit-identical
        # 共同验收门 = 三个生成器（plan/02 §七）。漏掉 gen_truth 等于真值库
        # 无人守——它正是基准的期望来源，手改即让评测失效。
        run: |
          python tools/gen_params.py --check
          python tools/gen_samples.py --check
          python tools/gen_truth.py --check

      - name: Zero-literal gate (with selftest)
        run: |
          python tools/check_literals.py --selftest
          python tools/check_literals.py

      - name: Desensitization audit (with selftest)
        # 随 CI 常驻：发布期才发现"仓库含真实个人信息"的代价是全历史重写
        run: |
          python tools/audit_desensitize.py --selftest
          python tools/audit_desensitize.py

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke (exit codes match declared semantics)
        shell: bash
        run: |
          python -m rcc.cli --version
          python -m rcc.cli selftest
          python -m rcc.cli run --purchases src/rcc/data/samples/purchases-demo.csv --bom src/rcc/data/samples/bom-demo.json || test $? -eq 1
          python -m rcc.cli bench

      - name: Console-script smoke (rcc) — 用户在 README 里敲的那条通路
        # 为什么单独一步：M6 干净环境验证抓出的头号缺陷正出在这条通路上——
        # 顶层 benchmark/ 未进安装面时，`python -m rcc.cli bench`（CWD 在
        # sys.path 上）能过，而**装好的 `rcc bench` 会 ModuleNotFoundError**。
        # 用 python -m 冒烟等于永远问不到"用户装完到底能不能跑"。
        #
        # M7 追加：**editable 态不够**。`pip install -e` 把仓库根放上 sys.path，
        # `find_data_dir()` 于是命中仓库里的 data/——而 wheel 里可能一个数据文件
        # 都没有（M7 修的就是这个）。故保留本步，**再加**下一步的真 wheel 装态。
        shell: bash
        run: |
          rcc --version
          rcc selftest
          rcc run --purchases src/rcc/data/samples/purchases-demo.csv --bom src/rcc/data/samples/bom-demo.json || test $? -eq 1
          rcc bench

      - name: Installed-wheel smoke (rcc) — 用户 pip install 之后的那条通路
        # 与上一步的区别是**装态**：editable 安装永远命中仓库根，问不到"包里的
        # 数据在不在"。本步从**仓库树外的干净副本**构建 wheel（避免 build/lib
        # 残留把负控骗绿——实测过：不复制干净副本时，删掉 package-data 也照样
        # 打出数据），装进全新 venv，再到中立目录跑 selftest/bench。
        # pytest 侧的同链路守门见 tests/guards/test_install_smoke.py。
        shell: bash
        run: |
          set -e
          WORK="$RUNNER_TEMP/rcc-install"
          rm -rf "$WORK"; mkdir -p "$WORK/whl" "$WORK/src"
          # 干净源码副本：只复制构建所需，不带 build/ 与 dist/
          cp pyproject.toml README.md LICENSE "$WORK/src/"
          cp -r src benchmark "$WORK/src/"
          python -m pip wheel "$WORK/src" --no-deps -w "$WORK/whl"
          python -m venv "$WORK/venv"
          if [ -x "$WORK/venv/bin/python" ]; then
            VPY="$WORK/venv/bin/python"; RCC="$WORK/venv/bin/rcc"
          else
            VPY="$WORK/venv/Scripts/python.exe"; RCC="$WORK/venv/Scripts/rcc.exe"
          fi
          "$VPY" -m pip install --no-deps "$WORK"/whl/*.whl
          # 中立目录：不在仓库树内跑，否则源码态的数据定位会顺手命中仓库
          cd "$WORK"
          "$RCC" --version
          "$RCC" selftest > selftest.json
          "$VPY" -c "import json; d=json.load(open('selftest.json',encoding='utf-8')); assert d['ok'] is True, d; assert d['param_count'] > 0, d; print('selftest ok, param_count=%d' % d['param_count'])"
          "$RCC" bench | tee bench.txt
          test "$(grep -c '\[达标\]' bench.txt)" -eq 5
          grep -q '总判: 达标' bench.txt
