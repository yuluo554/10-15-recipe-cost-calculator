name: CI

# M0 即配 CI（不推迟到发布期）：避免"把全项目 CI 首跑风险压进发布窗口"的反模式。
# 编码三层加固之一：CI 全局 UTF-8（只救 CI，代码入口守卫与子进程显式 encoding 另两层）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 旧解释器只在 windows 守（ubuntu 新镜像对 3.8 支持存疑）；
        # 跑完按实况记录，不硬凑四矩阵。
        include:
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 历史扫描类守门依赖 git 历史——浅克隆会让它静默削弱成空验
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with test extras
        # extras 集合必须覆盖全部里程碑门的依赖（pytest / pyyaml）
        run: python -m pip install -e ".[dev]"

      - name: Generate frozen artifacts and verify bit-identical
        run: |
          python tools/gen_params.py --check
          python tools/gen_samples.py --check

      - name: Zero-literal gate (with selftest)
        run: |
          python tools/check_literals.py --selftest
          python tools/check_literals.py

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke (exit codes match declared semantics)
        shell: bash
        run: |
          python -m rcc.cli --version
          python -m rcc.cli selftest
          python -m rcc.cli run --purchases data/samples/purchases-demo.csv --bom data/samples/bom-demo.json || test $? -eq 1
          python -m rcc.cli bench || test $? -eq 1
